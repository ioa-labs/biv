[package]
name = "better-image-view"
version = "0.1.0"
edition = "2024"
description = "A small, preloading GTK4 image viewer"
license = "MPL-2.0"

[[bin]]
name = "biv"
path = "src/main.rs"

[dependencies]
cairo-rs = { version = "0.22.0", features = ["png"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_20"] }
libvips = "2.3.0"
